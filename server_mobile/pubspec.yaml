version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  dart_frog: ^1.2.0
  dart_jsonwebtoken: ^2.14.0
  genkit: ^1.0.0
  genkit_google_genai: ^1.0.0
  http: ^1.2.0
  repengine_core:
    path: ../packages/repengine_core

dev_dependencies:
  dart_frog_lint: ^0.1.2
  lints: ^3.0.0
  mocktail: ^1.0.3
  test: ^1.24.0
