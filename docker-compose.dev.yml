services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rep
      POSTGRES_PASSWORD: rep
      POSTGRES_DB: repengine
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rep -d repengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://rep:rep@db:5432/repengine
      JWT_SECRET: dev-secret-key
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
      ANALYTICS_URL: http://mobile-bff:8080
    depends_on:
      - api
      - mobile-bff

  mobile-bff:
    build:
      context: .
      dockerfile: server_mobile/Dockerfile
    ports:
      - "8081:8080"
    environment:
      GO_CORE_URL: http://api:8080
      JWT_SECRET: dev-secret-key
      PORT: 8080
    depends_on:
      - api
    restart: on-failure

volumes:
  pgdata:

