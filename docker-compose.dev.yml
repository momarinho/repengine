services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rep
      POSTGRES_PASSWORD: rep
      POSTGRES_DB: repengine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rep -d repengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://rep:rep@db:5432/repengine
      JWT_SECRET: dev-secret-key
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  analytics:
    build: ./analytics
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PORT: 8000
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080"
    restart: on-failure

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
      ANALYTICS_URL: http://analytics:8000
    depends_on:
      - api
      - analytics

volumes:
  pgdata:
