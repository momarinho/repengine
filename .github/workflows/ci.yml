name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: API Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run Go tests
        env:
          CGO_ENABLED: 0
        run: go test ./...

  api-build:
    name: API Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build API binary
        env:
          CGO_ENABLED: 0
        run: go build ./cmd/server

  web-check:
    name: Web Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Run Svelte checks
        run: npm run check

  web-build:
    name: Web Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

  migration-smoke:
    name: Migration Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rep
          POSTGRES_PASSWORD: rep
          POSTGRES_DB: repengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rep -d repengine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://rep:rep@127.0.0.1:5432/repengine?sslmode=disable
      JWT_SECRET: ci-secret-key
      APP_ENV: ci
      PORT: 18080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run migration smoke test
        env:
          CGO_ENABLED: 0
        run: ./scripts/ci/migration-smoke.sh

  core-test:
    name: RepEngine Core Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/repengine_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run Core tests
        run: dart test

  bff-test:
    name: Mobile BFF Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run BFF tests
        run: dart test

  mobile-test:
    name: Flutter Mobile Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  mobile-build-apk:
    name: Flutter Mobile Build Release APK
    needs: [mobile-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repengine-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

